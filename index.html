<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Thesis | Sentinel-AI</title>
    <style>
        :root { --bg: #0b0e14; --card: #161b22; --accent: #2f81f7; --text: #adbac7; --code: #7ee787; --white: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* تنسيق الصفحة ليكون متصلاً (حل مشكلة التقطيع) */
        .page { background: var(--card); border-radius: 15px; width: 100%; max-width: 850px; min-height: auto; margin-bottom: 20px; padding: 50px; border: 1px solid #30363d; position: relative; box-sizing: border-box; transition: box-shadow 0.3s; }
        .page:hover { box-shadow: 0 0 30px rgba(47, 129, 247, 0.4); }

        /* الهيدر وشعار الجامعة (تم استبدال الباركود بالشعار الدائري الحقيقي) */
        .college-header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 20px; margin-bottom: 40px; }
        .mamon-logo { width: 120px; height: 120px; background: white; border-radius: 50%; padding: 5px; border: 3px solid var(--accent); }

        h1 { color: var(--white); font-size: 1.8rem; line-height: 1.4; margin: 30px 0; text-align: center; }
        h2 { border-right: 5px solid var(--accent); padding-right: 15px; color: var(--white); text-align: right; margin-top: 40px; font-size: 1.5rem; }
        
        /* تنسيق الصور السيبرانية */
        .cyber-image { width: 100%; border-radius: 10px; border: 1px solid #30363d; margin: 20px 0; opacity: 0.9; }

        /* الباركود النظيف في النهاية */
        .source-qr { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin-top: 20px; border: 3px solid var(--accent); }
        .source-qr img { width: 140px; height: 140px; }

        pre { background: #010409; padding: 20px; border-radius: 10px; border-left: 4px solid var(--code); color: var(--code); font-size: 14px; overflow-x: auto; direction: ltr; text-align: left; }
        
        .info-box { background: #0d1117; padding: 15px; border-radius: 10px; border: 1px solid #30363d; text-align: right; }
        .info-box p { margin: 5px 0; }
