<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الأمن السيبراني - كرار محمد</title>
    <style>
        :root { --bg: #0b0e14; --card: #161b22; --accent: #2f81f7; --text: #adbac7; --white: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .page { background: var(--card); border-radius: 15px; width: 100%; max-width: 800px; padding: 40px; margin-bottom: 20px; border: 1px solid #30363d; box-sizing: border-box; }
        .header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 20px; }
        .mamon-logo { width: 120px; height: 120px; background: white; border-radius: 50%; padding: 5px; border: 3px solid var(--accent); }
        h1, h2 { color: var(--white); }
        .cyber-image { width: 100%; border-radius: 10px; margin: 20px 0; border: 1px solid #30363d; }
        .info-box { background: #0d1117; padding: 20px; border-radius: 10px; border: 1px solid #30363d; margin: 20px 0; }
        .btn-download { background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .qr-section { text-align: center; margin-top: 30px; }
        .qr-code { background: white; padding: 10px; border-radius: 10px; display: inline-block; }
        @media print { .no-print { display: none; } body { padding: 0; } .page { border: none; margin: 0; } }
    </style>
</head>
<body>

    <div class="page">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Logo_of_Al-Ma%27mon_University_College.png/200px-Logo_of_Al-Ma%27mon_University_College.png" alt="شعار المأمون" class="mamon-logo">
            <h2>كلية المأمون الجامعة</h2>
            <p style="color: var(--accent);">قسم هندسة الأمن السيبراني</p>
        </div>

        <h1 style="text-align: center;">Use Deep Learning To detect unknown attacks (Zero-Day Attacks)</h1>

        <div class="info-box">
            <p><strong>اسم الطالب:</strong> كرار محمد داود</p>
            <p><strong>بإشراف الدكتور:</strong> أحمد سعد</p>
            <p><strong>العام الدراسي:</strong> 2025 - 2026</p>
        </div>

        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=800" class="cyber-image" alt="Cyber Security">
    </div>

    <div class="page">
        <h2>المصادر والمراجع</h2>
        <div class="qr-section">
            <p>امسح الكود للمصادر العلمية (IEEE):</p>
            <div class="qr-code">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://ieeexplore.ieee.org/abstract/document/8939402" alt="QR Code">
            </div>
        </div>
        
        <div style="text-align: center;">
            <button class="btn-download no-print" onclick="window.print()">📥 تحميل التقرير PDF</button>
        </div>
    </div>

</body>
</html>
