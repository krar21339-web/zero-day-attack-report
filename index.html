<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 HONEYPOT REPORT</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#00d2ff;
    --bg:#0b111a;
    --card:#111827;
    --border:rgba(255,255,255,0.08);
}

body{
    margin:0;
    font-family:Inter;
    background:var(--bg);
    color:#fff;
}

header{
    text-align:center;
    padding:80px 20px;
}

h1{
    font-family:Orbitron;
    font-size:3rem;
}

.content{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:var(--primary);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card h2{
    padding:15px;
    color:var(--primary);
}

.card p{
    padding:0 15px 20px;
    color:#aaa;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    padding:40px;
}

.modal-content{
    max-width:800px;
    margin:auto;
}

.modal img{
    width:100%;
    border-radius:10px;
}

.close{
    margin-bottom:20px;
    padding:10px 20px;
    border:1px solid var(--primary);
    background:none;
    color:var(--primary);
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>ESP32 HONEYPOT</h1>
<p>Cybersecurity Graduation Project</p>
</header>

<div class="content">

<div class="card" onclick="openModal('m1')">
<img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200">
<h2>1. INTRODUCTION</h2>
<p>Overview and project structure.</p>
</div>

<div class="card" onclick="openModal('m2')">
<img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=800">
<h2>2. TECHNOLOGY</h2>
<p>ESP32, WiFi and hardware used.</p>
</div>

<div class="card" onclick="openModal('m3')">
<img src="https://images.unsplash.com/photo-1518779578993-ec3579fee39f?q=80&w=800">
<h2>3. PROGRAMMING</h2>
<p>Firmware and system logic.</p>
</div>

<div class="card" onclick="openModal('m4')">
<img src="https://images.unsplash.com/photo-1544197150-b99a580bb7a8?q=80&w=800">
<h2>4. RISKS</h2>
<p>Security threats and attacks.</p>
</div>

<div class="card" onclick="openModal('m5')">
<img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=800">
<h2>5. RESULTS</h2>
<p>Final outcomes and analysis.</p>
</div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
<div class="modal-content">
<button class="close" onclick="closeModal()">BACK</button>
<div id="data"></div>
</div>
</div>

<script>
const content = {

m1:{
title:"INTRODUCTION",
img:"https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200",
text:"This project is a cybersecurity honeypot system based on ESP32. It is designed to simulate attacks and analyze network behavior. The report includes hardware, software, risks, and results."
},

m2:{
title:"TECHNOLOGY",
img:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=800",
text:"The system uses ESP32 microcontroller with built-in WiFi. It also includes OLED display (SSD1306) and network modules. Communication is handled using TCP/IP and DNS protocols."
},

m3:{
title:"PROGRAMMING",
img:"https://images.unsplash.com/photo-1518779578993-ec3579fee39f?q=80&w=800",
text:"The firmware is written in C++. It uses asynchronous programming to handle multiple connections. DNS spoofing and captive portal are implemented to simulate attacks."
},

m4:{
title:"RISKS",
img:"https://images.unsplash.com/photo-1544197150-b99a580bb7a8?q=80&w=800",
text:"The system demonstrates risks such as Evil Twin attacks, MITM attacks, and data interception. It highlights the importance of secure WiFi protocols like WPA3."
},

m5:{
title:"RESULTS",
img:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=800",
text:"The system successfully captured network requests and simulated attacks. Results show how users can be tricked and how networks can be monitored effectively."
}

};

function openModal(id){
let d = content[id];
document.getElementById("modal").style.display="block";
document.getElementById("data").innerHTML =
`<img src="${d.img}">
<h2>${d.title}</h2>
<p>${d.text}</p>`;
}

function closeModal(){
document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
