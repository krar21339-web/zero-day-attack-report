<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IoT Project Final Report</title>
    <style>
        @page { size: A4; margin: 0; }
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-print-color-adjust: exact; }
        
        /* حاوية الصفحة الأساسية */
        .page-container {
            width: 210mm;
            height: 297mm;
            padding: 22mm;
            box-sizing: border-box;
            background: #ffffff;
            position: relative;
            margin: 10mm auto;
            display: flex;
            flex-direction: column;
            page-break-after: always;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        /* --- تصميم الواجهة (الصفحة 1) --- */
        .header-top { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 35mm; }
        .main-title-box { text-align: center; margin-bottom: 35mm; }
        .project-title { font-size: 34pt; font-weight: 900; margin: 0; text-transform: uppercase; line-height: 1.1; }
        .sub-title { font-size: 14pt; color: #22d3ee; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .detail-item { border-left: 4px solid #000; padding-left: 15px; margin-bottom: 10px; }
        .label { font-size: 9pt; color: #22d3ee; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 2px; }
        .value { font-size: 11pt; font-weight: bold; }
        .value-ar { font-size: 12pt; font-weight: bold; font-family: 'Arial'; display: block; margin-top: 2px; }

        /* بوكس الأسماء المنظم (عربي وانجليزي) */
        .names-container {
            grid-column: span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #fcfcfc;
            border: 1px solid #eee;
            padding: 15px;
            margin-top: 10px;
        }
        .name-box { border-bottom: 1px solid #eee; padding-bottom: 5px; }

        /* --- تصميم المقدمة (الصفحة 2) --- */
        .intro-header { border-bottom: 1.5px solid #000; padding-bottom: 8px; margin-bottom: 25px; display: flex; justify-content: space-between; }
        .hw-card { display: flex; gap: 20px; margin-bottom: 25px; align-items: center; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #efefef; }
        .hw-img { width: 140px; height: 100px; object-fit: contain; background: white; border: 1px solid #ddd; border-radius: 5px; }
        .cyber-banner { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-top: auto; }

        .footer { 
            position: absolute; bottom: 15mm; left: 22mm; right: 22mm; 
            border-top: 1px solid #f0f0f0; padding-top: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .page-num { background: #000; color: #fff; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>
