<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Ma'moon Cyber Security Project</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --dark-bg: #05080a;
            --grid-line: rgba(0, 242, 255, 0.1);
        }

        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Nav Bar */
        nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-cyan);
            background: rgba(10, 14, 20, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 25px;
            cursor: pointer;
            display: none; /* يظهر فقط عند الدخول للتفاصيل */
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        /* Dashboard Grid */
        .hub-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            padding: 50px;
            max-width: 1200px;
            margin: auto;
        }

        .node-card {
            border: 1px solid rgba(0, 242, 255, 0.3);
            background: rgba(0, 242, 255, 0.05);
            padding: 0;
            cursor: pointer;
            position: relative;
            transition: 0.4s;
            overflow: hidden;
        }

        .node-card:hover {
            border-color: var(--neon-cyan);
            transform: scale(1.02);
            background: rgba(0, 242, 255, 0.1);
        }

        .node-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            filter: grayscale(50%) brightness(0.7);
        }

        .node-card h3 {
            padding: 15px;
            margin: 0;
            background: rgba(0, 0, 0, 0.8);
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-size: 14px;
            border-top: 1px solid var(--neon-cyan);
        }

        /* Detailed Section */
        #detail-view {
            display: none;
            padding: 60px;
            max-width: 1100px;
            margin: auto;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp { from {transform: translateY(20px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }

        .content-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        .content-box img {
            width: 100%;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        .description-text {
            line-height: 1.8;
            font-size: 16px;
        }

        .description-text h1 { color: var(--neon-cyan); font-size: 28px; }
        .description-text p { margin-bottom: 20px; text-align: justify; }

    </style>
</head>
<body>

<nav>
    <div style="font-size: 20px; font-weight: bold; color: var(--neon-cyan);">AL-MA'MOON // CYBER_EMULATION_LAB</div>
    <button class="back-btn" id="backBtn" onclick="hideDetails()">[ BACK TO SYSTEM_HUB ]</button>
</nav>

<div class="hub-container" id="hub">
    <div class="node-card" onclick="showDetails('intro')">
        <img src="1000066879.png" alt="Overview">
        <h3>01 // System Overview & Introduction</h3>
    </div>
    <div class="node-card" onclick="showDetails('tech')">
        <img src="1000066883.jpg" alt="Technology">
        <h3>02 // Hardware Architecture (ESP32)</h3>
    </div>
    <div class="node-card" onclick="showDetails('risks')">
        <img src="1000066879.png" alt="Risks">
        <h3>03 // Threat Vectors & Wireless Risks</h3>
    </div>
    <div class="node-card" onclick="showDetails('results')">
        <img src="1000066879.png" alt="Results">
        <h3>04 // Analysis Results & Conclusion</h3>
    </div>
</div>

<div id="detail-view">
    <div class="content-box" id="detailContent">
        </div>
</div>

<script>
    const projectData = {
        intro: {
            title: "Advanced IoT Emulation",
            img: "1000066879.png",
            desc: "This project explores the vulnerabilities of IEEE 802.11 networks. By deploying a custom-built ESP32 node, we simulated a rogue access point environment to analyze how university devices interact with unauthenticated signals. This is a critical study in proactive cybersecurity defense."
        },
        tech: {
            title: "ESP32-S Hardware Stack",
            img: "1000066883.jpg",
            desc: "The hardware layer utilizes the ESP32-S Dual-Core SoC. Key components include the I2C Bus for SSD1306 OLED communication, enabling real-time status monitoring of the traffic injection. The system operates in promiscuous mode to capture raw frame data."
        },
        risks: {
            title: "Risk Analysis (Evil Twin)",
            img: "1000066879.png",
            desc: "The 'Evil Twin' attack vector demonstrated here shows how an attacker can masquerade as a university gateway. Risks identified include Man-in-the-Middle (MitM) data interception, session hijacking, and credential harvesting via fake login portals."
        },
        results: {
            title: "Research Findings",
            img: "1000066879.png",
            desc: "Our results confirm that institutional security requires more than just WPA2 passwords. The implementation of 802.1X Enterprise authentication and client isolation is essential. The ESP32 successfully managed multiple simulated connections without data loss."
        }
    };

    function showDetails(key) {
        const item = projectData[key];
        document.getElementById('hub').style.display = 'none';
        document.getElementById('backBtn').style.display = 'block';
        const detailView = document.getElementById('detail-view');
        detailView.style.display = 'block';
        
        document.getElementById('detailContent').innerHTML = `
            <img src="${item.img}">
            <div class="description-text">
                <h1>${item.title}</h1>
                <p>${item.desc}</p>
                <div style="border-top: 1px solid #333; padding-top: 20px; color: #888;">
                    STATUS: SECURE_VIEW_ACCESS<br>
                    ENCRYPTION: AES-256-EMULATED
                </div>
            </div>
        `;
    }

    function hideDetails() {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('hub').style.display = 'grid';
    }
</script>

</body>
</html>
